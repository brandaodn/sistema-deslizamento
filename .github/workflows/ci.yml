name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: movmassa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d movmassa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SESSION_SECRET: test-session-secret
      NODE_ENV: test
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: movmassa_test
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Initialize database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d movmassa_test -f scriptBD.sql

      - name: Check JavaScript syntax
        run: find . -path './node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test -- --runInBand --forceExit
