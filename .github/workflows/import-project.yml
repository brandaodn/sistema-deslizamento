name: Import project
# retry after validated chunk sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-project.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and extract project
        shell: bash
        run: |
          set -euo pipefail
          cat .import/chunk* > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.zip
          test "$(wc -c < /tmp/project.zip)" -eq 165063
          mkdir -p /tmp/project-unpack
          unzip -q /tmp/project.zip -d /tmp/project-unpack
          src="$(find /tmp/project-unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$src"
          shopt -s dotglob
          cp -a "$src"/. .
          rm -rf .import
          rm -f .github/workflows/import-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import project source [skip ci]"
          git push
